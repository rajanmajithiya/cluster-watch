# CI/CD pipeline. Runs on GitHub's servers on every push and pull request.
#
#   push / PR ──► test (Node + real Postgres) ──┐
#             └─► manifests (render k8s YAML) ──┴─► image (build; push to GHCR only from main or a v* tag)
#
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege: by default the workflow's token can only READ the repo.
# The image job asks for packages:write on its own, nothing else gets it.
permissions:
  contents: read

# Push twice quickly to the same branch → cancel the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04            # pinned: "latest" changes under you (same reason as image tags)
    timeout-minutes: 10              # a hung test must not burn CI minutes for 6 hours (the default)

    # A real Postgres for this job, as a Docker container next to the runner.
    # Same version as production (k8s/postgres.yaml), so we test what we ship against.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clusterwatch
          POSTGRES_PASSWORD: clusterwatch
          POSTGRES_DB: clusterwatch_test
        ports:
          - 5432:5432
        # don't start the steps until the DB actually accepts connections
        options: >-
          --health-cmd "pg_isready -U clusterwatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://clusterwatch:clusterwatch@localhost:5432/clusterwatch_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm                 # reuse ~/.npm between runs: faster npm ci

      - run: npm ci                  # exact versions from package-lock.json

      - run: npm test                # CI=true is set by GitHub → DB tests can't silently skip

  manifests:
    runs-on: ubuntu-24.04            # pinned: "latest" changes under you (same reason as image tags)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Catch broken YAML / kustomize errors before they reach a cluster. kubectl is preinstalled on GitHub runners.
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s/ > rendered.yaml && grep -c "^kind:" rendered.yaml

  image:
    needs: [test, manifests]         # never build an image from code that failed its tests
    runs-on: ubuntu-24.04            # pinned: "latest" changes under you (same reason as image tags)
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write                # needed to push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN is created fresh for every run and expires when it ends: no long-lived password stored anywhere.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Decide the tags. Every image gets an immutable sha-<commit> tag, so you always know exactly which
      # code is running. A git tag v1.2.3 also produces 1.2.3 and 1.2.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}   # PRs: build only, to prove the Dockerfile works
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha       # reuse layers from previous runs (the npm ci layer, like locally)
          cache-to: type=gha,mode=max
