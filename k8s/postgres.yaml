# In production you'd use a managed database (RDS / Azure Database / Cloud SQL): backups, failover and
# upgrades are their problem. Running it here as a StatefulSet shows how Kubernetes handles state.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None                 # headless: DNS "postgres" resolves straight to the pod's IP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
# StatefulSet, not Deployment: stable identity (postgres-0) and a volume that follows THAT pod
# across restarts and rescheduling. A Deployment's pods are interchangeable and disposable.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:18-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  # One PersistentVolumeClaim per pod (data-postgres-0). It survives pod deletion AND `kubectl delete statefulset`.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
